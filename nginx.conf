events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;
    error_log   /var/log/nginx/error.log;

    sendfile        on;
    keepalive_timeout  65;

    # 定义通用的代理头
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # 使用 map 指令动态设置 upstream
    map $request_uri $backend {
        default                     graph-node-blocks:8020;  # 默认服务
        ~^/blocks                   graph-node-blocks:8020;
        ~^/exchange-cake-pairs      graph-node-exchange-cake-pairs:8120;
        ~^/exchange-v2              graph-node-exchange-v2:8220;
        ~^/exchange-v3              graph-node-exchange-v3:8320;
        ~^/pairs                    graph-node-pairs:8420;
        ~^/user-position-v3         graph-node-user-position-v3:8520;
        ~^/ipfs                     ipfs:5001;
    }

    # 监听 80 端口（Nginx 服务）
    server {
        listen 80;

        # 动态转发请求到对应的 upstream
        location / {
            # 根据 $backend 变量转发请求
            proxy_pass http://$backend;

            # 如果是 GET 请求，并且路径不是 /ipfs，将其转换为 POST 请求
            if ($request_method = GET) {
                set $query_body '{"query": "$arg_query"}';
                proxy_method POST;
                proxy_set_header Content-Type "application/json";
                proxy_set_header Content-Length $content_length;
                proxy_set_body $query_body;
            }
        }
    }
}