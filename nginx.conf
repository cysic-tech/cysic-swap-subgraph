events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;
    error_log   /var/log/nginx/error.log;

    sendfile        on;
    keepalive_timeout  65;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Content-Type "application/json";

    # 定义 Graph Node 的 HTTP 服务
    upstream graph-node {
        server localhost:8000;  # Graph Node 的 HTTP 服务地址
    }

    server {
        listen 80;

        # 仅转发 /subgraphs/name/ 路径的请求
        location /subgraphs/name/ {
            # 允许 GET、POST 和 OPTIONS 方法
            if ($request_method !~ ^(GET|POST|OPTIONS)$) {
                return 405;
            }

            # 如果是 GET 请求，将其转换为 POST 请求
            if ($request_method = GET) {
                # 将查询参数转换为请求体
                set $query_body '{"query": "$arg_query"}';
                proxy_method POST;
                proxy_set_header Content-Type "application/json";
                proxy_set_header Content-Length $content_length;
                proxy_set_body $query_body;  # 设置请求体
            }

            # 如果是 OPTIONS 请求，直接返回 204
            if ($request_method = OPTIONS) {
                add_header 'Access-Control-Allow-Origin' '*';
                add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS';
                add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization';
                return 204;
            }

            # 转发到 Graph Node 的 HTTP 服务
            proxy_pass http://graph-node;

            # 确保请求方法被正确转发
            proxy_set_header X-Forwarded-Method $request_method;
        }

        # 其他路径（如 /）不转发，直接返回 404
        location / {
            return 404;
        }
    }
}