events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;
    error_log   /var/log/nginx/error.log;

    sendfile        on;
    keepalive_timeout  65;

    # 定义多个 Graph Node 服务
    upstream graph-node-blocks {
        server graph-node-blocks:8020;
    }

    upstream graph-node-exchange-cake-pairs {
        server graph-node-exchange-cake-pairs:8120;
    }

    upstream graph-node-exchange-v2 {
        server graph-node-exchange-v2:8220;
    }

    upstream graph-node-exchange-v3 {
        server graph-node-exchange-v3:8320;
    }

    upstream graph-node-pairs {
        server graph-node-pairs:8420;
    }

    upstream graph-node-user-position-v3 {
        server graph-node-user-position-v3:8520;
    }

    # 定义 IPFS 服务
    upstream ipfs {
        server ipfs:5001;
    }

    # 监听 8082 端口（Nginx 服务）
    server {
        listen 80;

        # 转发 /blocks 路径的请求到 graph-node-blocks
        location /blocks {
            proxy_pass http://graph-node-blocks;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 转发 /exchange-cake-pairs 路径的请求到 graph-node-exchange-cake-pairs
        location /exchange-cake-pairs {
            proxy_pass http://graph-node-exchange-cake-pairs;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 转发 /exchange-v2 路径的请求到 graph-node-exchange-v2
        location /exchange-v2 {
            proxy_pass http://graph-node-exchange-v2;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 转发 /exchange-v3 路径的请求到 graph-node-exchange-v3
        location /exchange-v3 {
            proxy_pass http://graph-node-exchange-v3;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 转发 /pairs 路径的请求到 graph-node-pairs
        location /pairs {
            proxy_pass http://graph-node-pairs;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 转发 /user-position-v3 路径的请求到 graph-node-user-position-v3
        location /user-position-v3 {
            proxy_pass http://graph-node-user-position-v3;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 转发 /ipfs 路径的请求到 IPFS 服务
        location /ipfs {
            proxy_pass http://ipfs;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}