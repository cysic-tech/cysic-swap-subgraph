events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;
    error_log   /var/log/nginx/error.log;

    sendfile        on;
    keepalive_timeout  65;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Content-Type "application/json";

    upstream graph-node-blocks {
        server 10.200.21.15:8020;  # 宿主机的 IP 和映射端口
    }

    upstream graph-node-exchange-cake-pairs {
        server 10.200.21.15:8120;  # 宿主机的 IP 和映射端口
    }

    upstream graph-node-exchange-v2 {
        server 10.200.21.15:8220;  # 宿主机的 IP 和映射端口
    }

    upstream graph-node-exchange-v3 {
        server 10.200.21.15:8320;  # 宿主机的 IP 和映射端口
    }

    upstream graph-node-pairs {
        server 10.200.21.15:8420;  # 宿主机的 IP 和映射端口
    }

    upstream graph-node-user-position-v3 {
        server 10.200.21.15:8520;  # 宿主机的 IP 和映射端口
    }

    # 使用 map 指令来映射子图名称到对应的 upstream
    map $subgraph_name $backend {
        "blocks"                  graph-node-blocks;
        "exchange-cake-pairs"    graph-node-exchange-cake-pairs;
        "exchange-v2"            graph-node-exchange-v2;
        "exchange-v3"            graph-node-exchange-v3;
        "pairs"                  graph-node-pairs;
        "user-position-v3"       graph-node-user-position-v3;
    }

    server {
        listen 80;

        location /subgraphs/name/cysicswap/ {
            # 提取子图名称并存储到 $subgraph_name 变量
            if ($uri ~ ^/subgraphs/name/cysicswap/([^/]+)) {
                set $subgraph_name $1;
            }

            # 允许 POST 和 OPTIONS 方法
            if ($request_method !~ ^(POST|OPTIONS)$) {
                return 405;
            }

            # 根据子图名称转发到对应的 upstream
            proxy_pass http://$backend;

            # 确保请求方法被正确转发
            proxy_set_header X-Forwarded-Method $request_method;
        }
    }
}