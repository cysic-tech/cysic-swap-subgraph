events {}

http {
    # 定义多个 Graph Node 实例的上游服务器
    upstream graph-node-blocks {
        server 172.17.0.1:8000;
    }

    upstream graph-node-exchange-cake-pairs {
        server 172.17.0.1:8100;
    }

    upstream graph-node-exchange-v2 {
        server 172.17.0.1:8200;
    }

    upstream graph-node-exchange-v3 {
        server 172.17.0.1:8300;
    }

    upstream graph-node-pairs {
        server 172.17.0.1:8400;
    }

    upstream graph-node-user-position-v3 {
        server 172.17.0.1:8500;
    }

    # 配置反向代理
    server {
        listen 80;
        server_name dev-swap.prover.xyz localhost 127.0.0.1;

        # https://dev-swap.prover.xyz/subgraphs/name/cysicswap/blocks/graphql?query=
        # https://dev-swap.prover.xyz/subgraphs/name/cysicswap/exchange-cake-pairs/graphql?query=
        location ~ ^/subgraphs/name/cysicswap/([^/]+)/ {
            proxy_pass http://graph-node-$1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}