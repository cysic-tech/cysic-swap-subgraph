user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    keepalive_timeout  65;

    upstream graph-node-blocks {
        server graph-node-blocks:8020;
    }

    upstream graph-node-exchange-cake-pairs {
        server graph-node-exchange-cake-pairs:8020;
    }

    upstream graph-node-exchange-v2 {
        server graph-node-exchange-v2:8020;
    }

    upstream graph-node-exchange-v3 {
        server graph-node-exchange-v3:8020;
    }

    upstream graph-node-pairs {
        server graph-node-pairs:8020;
    }

    upstream graph-node-user-position-v3 {
        server graph-node-user-position-v3:8020;
    }

    server {
        listen 80;

        location /subgraphs/name/cysicswap/ {
            # 允许 GET 和 POST 请求
            if ($request_method !~ ^(GET|POST|OPTIONS)$) {
                return 405;  # 如果不允许的请求方法，返回 405 Method Not Allowed
            }

            # 如果是 GET 请求，将查询参数转换为 JSON 格式
            if ($request_method = GET) {
                set $query_json '{"query": "$arg_query"}';
                proxy_pass http://graph-node-$1?$query_json;
            }

            # 如果是 POST 请求，直接转发
            if ($request_method = POST) {
                rewrite ^/subgraphs/name/cysicswap/(.*) /$1 break;
                proxy_pass http://graph-node-$1;
            }

            rewrite ^/subgraphs/name/cysicswap/(.*) /$1 break;
            proxy_pass http://graph-node-$1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

    }
}