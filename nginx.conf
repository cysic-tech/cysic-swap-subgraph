events {}

http {
    # 定义多个 Graph Node 实例的上游服务器
    upstream graph-node-blocks {
        server 172.17.0.1:8000;
    }

    upstream graph-node-exchange-cake-pairs {
        server 172.17.0.1:8100;
    }

    upstream graph-node-exchange-v2 {
        server 172.17.0.1:8200;
    }

    upstream graph-node-exchange-v3 {
        server 172.17.0.1:8300;
    }

    upstream graph-node-pairs {
        server 172.17.0.1:8400;
    }

    upstream graph-node-user-position-v3 {
        server 172.17.0.1:8500;
    }

    # 配置反向代理
    server {
        listen 80;
        server_name localhost;

        # Graph Node 实例 1: blocks
        location /blocks/ {
            proxy_pass http://graph-node-blocks/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Graph Node 实例 2: exchange-cake-pairs
        location /exchange-cake-pairs/ {
            proxy_pass http://graph-node-exchange-cake-pairs/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Graph Node 实例 3: exchange-v2
        location /exchange-v2/ {
            proxy_pass http://graph-node-exchange-v2/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Graph Node 实例 4: exchange-v3
        location /exchange-v3/ {
            proxy_pass http://graph-node-exchange-v3/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Graph Node 实例 5: pairs
        location /pairs/ {
            proxy_pass http://graph-node-pairs/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Graph Node 实例 6: user-position-v3
        location /user-position-v3/ {
            proxy_pass http://graph-node-user-position-v3/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}