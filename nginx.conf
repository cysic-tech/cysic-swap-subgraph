user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    keepalive_timeout  65;

    upstream graph-node-blocks {
        server graph-node-blocks:8020;
    }

    upstream graph-node-exchange-cake-pairs {
        server graph-node-exchange-cake-pairs:8020;
    }

    upstream graph-node-exchange-v2 {
        server graph-node-exchange-v2:8020;
    }

    upstream graph-node-exchange-v3 {
        server graph-node-exchange-v3:8020;
    }

    upstream graph-node-pairs {
        server graph-node-pairs:8020;
    }

    upstream graph-node-user-position-v3 {
        server graph-node-user-position-v3:8020;
    }

    server {
        listen 80;

        location /subgraphs/name/cysicswap/blocks {
            proxy_pass http://graph-node-blocks;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /subgraphs/name/cysicswap/exchange-cake-pairs {
            proxy_pass http://graph-node-exchange-cake-pairs;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /subgraphs/name/cysicswap/exchange-v2 {
            proxy_pass http://graph-node-exchange-v2;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /subgraphs/name/cysicswap/exchange-v3 {
            proxy_pass http://graph-node-exchange-v3;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /subgraphs/name/cysicswap/pairs {
            proxy_pass http://graph-node-pairs;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /subgraphs/name/cysicswap/user-position-v3 {
            proxy_pass http://graph-node-user-position-v3;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}