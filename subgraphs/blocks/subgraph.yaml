specVersion: 0.0.2
description: Binance Smart Chain Blocks
repository: https://github.com/pancakeswap
schema:
  file: ./schema.graphql
dataSources:
  - kind: ethereum/contract
    name: Blocks
    network: cysic-dev
    source:
      address: "0x0000000000000000000000000000000000000000"
      abi: DummyContract
      startBlock: 1 
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.4
      language: wasm/assemblyscript
      file: ./mappings/index.ts
      entities:
        - Block
      abis:
        - name: DummyContract
          file: ./abis/DummyContract.json
      blockHandlers:
        - handler: handleBlock
