version: '3.8'

# Graph Node 基础配置
x-graph-node-base: &graph-node-base
  image: graphprotocol/graph-node:latest
  environment:
    - postgres_host=10.200.21.15
    - postgres_port=7432
    - postgres_user=blockscout
    - postgres_pass=ceWb1MeLBEeOIfk65gU8EjF8
    - postgres_db=blockscout
    - ipfs=ipfs:5001
    - ethereum=http://10.200.21.53:8655
    - ethereum=cysic-dev:http://10.200.21.53:8655  # 自定义 RPC 节点
    - RUST_LOG=info
    - NVM_DIR=/root/.nvm  # 设置 NVM_DIR
  depends_on:
    - ipfs
  restart: unless-stopped
  volumes: 
    - ./:/subgraph

services:
  # IPFS 服务
  ipfs:
    image: ipfs/go-ipfs:latest
    ports:
      - "5001:5001"  # IPFS API 端口
      - "8083:8080"  # IPFS 网关端口
    volumes:
      - ./ipfs_data:/data/ipfs
    restart: unless-stopped

  # Graph Node 实例 1: blocks
  graph-node-blocks:
    <<: *graph-node-base
    ports:
      - "8000:8000"  # HTTP 端口（查询和 UI）
      - "8001:8001"  # WebSocket 端口（订阅）
      - "8020:8020"  # Indexer 管理端口
      - "8030:8030"
      - "8040:8040"
    command: >
      sh -c "apt-get update && apt-get install -y curl &&
             curl -o- https://raw.githubusercontent.com/nvm-sh/nvm/v0.40.1/install.sh | bash &&
             export NVM_DIR=/root/.nvm &&  # 设置 NVM_DIR
             [ -s \"$NVM_DIR/nvm.sh\" ] && \. \"$NVM_DIR/nvm.sh\" &&
             nvm install v22 &&
             nvm use v22 &&
             cd /subgraph/subgraphs/blocks &&
             npm install &&
             npm run create &&
             npm run deploy"

  # Graph Node 实例 2: exchange-cake-pairs
  graph-node-exchange-cake-pairs:
