specVersion: 0.0.2
description: Binance Smart Chain Blocks
repository: https://github.com/pancakeswap
schema:
  file: ./schema.graphql
dataSources:
  - kind: ethereum/contract
    name: Blocks
    network: cysic-dev
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.4
      language: wasm/assemblyscript
      file: ./mappings/index.ts
      entities:
        - Block
      blockHandlers:
        - handler: handleBlock
networks:
  cysic-dev:
    chain: cysic-dev
    host: http://10.200.21.53:8655